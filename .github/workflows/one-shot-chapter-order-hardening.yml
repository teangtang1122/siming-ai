name: One-shot chapter order hardening

on:
  push:
    branches:
      - feature/independent-chapter-order
    paths:
      - scripts/one_shot_chapter_order_hardening.py
      - .github/workflows/one-shot-chapter-order-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/independent-chapter-order
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply hardening patch
        run: python scripts/one_shot_chapter_order_hardening.py
      - name: Validate generated sources
        run: |
          python -m compileall -q backend/app backend/alembic
          git diff --check
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make chapter order authoritative across writing paths"
          git push origin HEAD:feature/independent-chapter-order
