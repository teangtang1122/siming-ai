name: One-shot advanced ViewModel facade patch

on:
  push:
    branches:
      - feat/android-pc-parity-3
    paths:
      - .github/workflows/patch-viewmodel-advanced-commands.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/android-pc-parity-3
      - run: python .github/scripts/patch_viewmodel_advanced_commands.py
      - run: |
          git rm \
            .github/scripts/patch_viewmodel_advanced_commands.py \
            .github/workflows/patch-viewmodel-advanced-commands.yml
          git add mobile/android/app/src/main/java/com/siming/mobile/ui/MainViewModel.kt
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(android): expose advanced authoring commands to UI"
          git push origin HEAD:feat/android-pc-parity-3
