name: Temporary Android mobile import export UI phase 2

on:
  pull_request:
    branches:
      - develop
    paths:
      - "mobile/**"
      - "contracts/mobile-pc-parity.json"
      - "docs/mobile-pc-parity.md"
      - "scripts/patch-android-mobile-import-export-ui.py"
      - ".github/workflows/apply-android-mobile-import-export-ui-temporary.yml"
      - ".github/android-mobile-import-export-ui.trigger"

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.ref == 'feature/android-mobile-import-export-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/android-mobile-import-export-ui
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Apply focused implementation
        run: |
          set -euo pipefail
          python scripts/patch-android-mobile-import-export-ui.py
          python scripts/check-mobile-pc-parity.py --write-doc docs/mobile-pc-parity.md
          git diff --check

      - name: Validate parity contract
        run: python scripts/check-mobile-pc-parity.py --check-doc docs/mobile-pc-parity.md

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Test, lint, and build Android
        working-directory: mobile/android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Commit implementation and remove temporary files
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-android-mobile-import-export-ui-temporary.yml
          rm -f scripts/patch-android-mobile-import-export-ui.py
          rm -f .github/android-mobile-import-export-ui.trigger
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(android): add import cataloging export and mobile project tools'
          git push origin HEAD:feature/android-mobile-import-export-ui
