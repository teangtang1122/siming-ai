name: Temporary Android mobile import export UI phase 2

on:
  pull_request:
    branches:
      - develop
    paths:
      - "mobile/**"
      - "contracts/mobile-pc-parity.json"
      - "docs/mobile-pc-parity.md"
      - "scripts/patch-android-mobile-import-export-ui.py"
      - ".github/workflows/apply-android-mobile-import-export-ui-temporary.yml"
      - ".github/android-mobile-import-export-ui.trigger"

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.ref == 'feature/android-mobile-import-export-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/android-mobile-import-export-ui
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Apply focused implementation
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/patch-android-mobile-import-export-ui.py')
          text = path.read_text(encoding='utf-8')

          marker = "'            snackbar = snackbar,\\n            onSaveExport = onSaveExport,\\n        )\\n',"
          pos = text.find(marker)
          if pos < 0:
              raise SystemExit('unique ProjectScreen export callback marker missing')
          start = text.rfind('replace_once(\n', 0, pos)
          end = text.find(')\nreplace_once(\n', pos)
          if start < 0 or end < 0:
              raise SystemExit('could not isolate ProjectScreen replacement block')
          replacement = '''replace_once(
              "mobile/android/app/src/main/java/com/siming/mobile/ui/SimingApp.kt",
              '    val selectedProject = projects.firstOrNull { it.projectId == selectedProjectId }\\n'
              '    if (selectedProject != null) {\\n'
              '        ProjectScreen(\\n'
              '            viewModel = viewModel,\\n'
              '            project = selectedProject,\\n'
              '            onBack = { selectedProjectId = null },\\n'
              '            snackbar = snackbar,\\n'
              '        )\\n'
              '        return\\n'
              '    }\\n',
              '    val selectedProject = projects.firstOrNull { it.projectId == selectedProjectId }\\n'
              '    if (selectedProject != null) {\\n'
              '        ProjectScreen(\\n'
              '            viewModel = viewModel,\\n'
              '            project = selectedProject,\\n'
              '            onBack = { selectedProjectId = null },\\n'
              '            snackbar = snackbar,\\n'
              '            onSaveExport = onSaveExport,\\n'
              '        )\\n'
              '        return\\n'
              '    }\\n',
          )
          '''
          text = text[:start] + replacement + text[end + 2:]

          nav_start = text.find('nav_old = dedent(\n')
          nav_call = '''replace_once(
              "mobile/android/app/src/main/java/com/siming/mobile/ui/SimingApp.kt",
              nav_old,
              '            ProjectSectionNavigation(selected = section, onSelected = { section = it })\\n',
          )
          '''
          nav_end = text.find(nav_call, nav_start)
          if nav_start < 0 or nav_end < 0:
              raise SystemExit('could not isolate navigation patch block')
          nav_end += len(nav_call)
          nav_replacement = '''nav_source = read("mobile/android/app/src/main/java/com/siming/mobile/ui/SimingApp.kt")
          nav_anchor = '            Row(\\n                modifier = Modifier\\n                    .horizontalScroll(rememberScrollState())\\n'
          nav_start_index = nav_source.find(nav_anchor)
          nav_end_marker = '            when (section) {\\n'
          nav_end_index = nav_source.find(nav_end_marker, nav_start_index)
          if nav_start_index < 0 or nav_end_index < 0:
              raise SystemExit("mobile project navigation anchors missing")
          nav_old = nav_source[nav_start_index:nav_end_index]
          replace_once(
              "mobile/android/app/src/main/java/com/siming/mobile/ui/SimingApp.kt",
              nav_old,
              '            ProjectSectionNavigation(selected = section, onSelected = { section = it })\\n',
          )
          '''
          text = text[:nav_start] + nav_replacement + text[nav_end:]
          path.write_text(text, encoding='utf-8')
          PY
          python scripts/patch-android-mobile-import-export-ui.py
          python - <<'PY'
          from pathlib import Path
          path = Path('mobile/android/app/src/main/java/com/siming/mobile/ui/ProjectToolsPanel.kt')
          text = path.read_text(encoding='utf-8')
          if 'import androidx.compose.foundation.layout.ExperimentalLayoutApi\n' not in text:
              text = text.replace(
                  'import androidx.compose.foundation.layout.Column\n',
                  'import androidx.compose.foundation.layout.Column\nimport androidx.compose.foundation.layout.ExperimentalLayoutApi\n',
                  1,
              )
          target = '@Composable\ninternal fun ProjectToolsPanel('
          if target in text:
              text = text.replace(target, '@OptIn(ExperimentalLayoutApi::class)\n@Composable\ninternal fun ProjectToolsPanel(', 1)
          path.write_text(text, encoding='utf-8')
          PY
          python scripts/check-mobile-pc-parity.py --write-doc docs/mobile-pc-parity.md
          git diff --check

      - name: Validate parity contract
        run: python scripts/check-mobile-pc-parity.py --check-doc docs/mobile-pc-parity.md

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Test, lint, and build Android
        working-directory: mobile/android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Commit implementation and remove temporary files
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-android-mobile-import-export-ui-temporary.yml
          rm -f scripts/patch-android-mobile-import-export-ui.py
          rm -f .github/android-mobile-import-export-ui.trigger
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(android): add import cataloging export and mobile project tools'
          git push origin HEAD:feature/android-mobile-import-export-ui
