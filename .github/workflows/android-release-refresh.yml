name: Android Release Refresh

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release whose Android assets will be refreshed
        required: true
        default: v3.3.3
        type: string

permissions:
  contents: read

jobs:
  build-signed-apk:
    if: github.ref_name == 'main'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SIMING_RELEASE_TAG: ${{ inputs.release_tag }}
      SIMING_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SIMING_ANDROID_KEYSTORE_PASSWORD }}
      SIMING_ANDROID_KEY_ALIAS: ${{ secrets.SIMING_ANDROID_KEY_ALIAS }}
      SIMING_ANDROID_KEY_PASSWORD: ${{ secrets.SIMING_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Require main and matching Android version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_REF_NAME -ne "main") { throw "Android refresh must run from main." }
          if ($env:SIMING_RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "Invalid release tag." }
          $androidBuild = Get-Content mobile/android/app/build.gradle.kts -Raw
          $version = [regex]::Match($androidBuild, 'versionName\s*=\s*"([^"]+)"').Groups[1].Value
          if (-not $version -or $env:SIMING_RELEASE_TAG -ne "v$version") {
            throw "Release tag '$env:SIMING_RELEASE_TAG' does not match Android version '$version'."
          }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: pwsh
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Test and lint Android
        working-directory: mobile/android
        shell: pwsh
        run: ./gradlew.bat testDebugUnitTest lintDebug --stacktrace

      - name: Prepare Android signing key
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.SIMING_ANDROID_KEYSTORE_BASE64 }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:KEYSTORE_BASE64)) {
            throw "SIMING_ANDROID_KEYSTORE_BASE64 is not configured."
          }
          $keystore = Join-Path $env:RUNNER_TEMP "siming-android-release.jks"
          [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          "SIMING_ANDROID_KEYSTORE_FILE=$keystore" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and verify signed APK
        shell: pwsh
        run: ./scripts/build-android-release.ps1

      - name: Record source provenance
        shell: pwsh
        run: |
          $lines = @(
            "release_tag=$env:SIMING_RELEASE_TAG"
            "source_commit=$env:GITHUB_SHA"
            "source_ref=$env:GITHUB_REF"
            "workflow_run=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          )
          [IO.File]::WriteAllLines(
            (Join-Path $PWD "release\Siming-apk-provenance.txt"),
            $lines,
            [Text.UTF8Encoding]::new($false)
          )

      - name: Upload verified Android assets
        uses: actions/upload-artifact@v4
        with:
          name: android-release-refresh-${{ inputs.release_tag }}-${{ github.sha }}
          path: |
            release/Siming.apk
            release/Siming-apk-sha256.txt
            release/Siming-apk-provenance.txt
          if-no-files-found: error
          retention-days: 7
