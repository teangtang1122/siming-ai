name: Temporary Regenerate OpenAPI Types

on:
  push:
    branches:
      - feat/android-pc-parity-3
    paths:
      - ".github/workflows/regenerate-openapi-temporary.yml"

permissions:
  contents: write

concurrency:
  group: regenerate-pr30-openapi
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    env:
      MOSHU_DISABLE_AUTO_MCP_SETUP: "1"
      SIMING_ENABLE_LOCAL_RUNTIME: "0"
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/android-pc-parity-3
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate and commit OpenAPI types
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
          npm ci --prefix frontend
          npm --prefix frontend run api:generate
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/api/generated/schema.d.ts
          if git diff --cached --quiet; then
            echo "OpenAPI types were already current."
            exit 0
          fi
          git commit -m "chore(api): regenerate OpenAPI types"
          git push origin HEAD:refs/heads/feat/android-pc-parity-3
