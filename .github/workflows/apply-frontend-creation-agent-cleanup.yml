name: Apply frontend Creation Agent cleanup

on:
  push:
    branches: ["codex/creation-agent-mobile-parity-3.2.1"]
    paths:
      - ".github/workflows/apply-frontend-creation-agent-cleanup.yml"
      - "scripts/remove-legacy-creation-interview-frontend.py"

permissions:
  contents: write

jobs:
  cleanup-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/creation-agent-mobile-parity-3.2.1
          fetch-depth: 0

      - name: Remove legacy frontend interview flow
        run: python scripts/remove-legacy-creation-interview-frontend.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Refresh generated OpenAPI types
        working-directory: frontend
        run: |
          npm run api:generate
          npm run api:check

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Guard legacy interview runtime frontend
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path("frontend/src")
          pattern = re.compile(
              r"useNovelCreationInterviewController|novelInterview\.|NOVEL_INTERVIEW_|refresh-question|/interview/next|"
              r"submitQuestionAnswer|renderQuestions|renderQAEditor|questionHistory|handleRegenerateWithAnswers"
          )
          matches = []
          for path in sorted(root.rglob("*")):
              if not path.is_file() or path.suffix not in {".ts", ".tsx"}:
                  continue
              relative = path.relative_to(root)
              if "__tests__" in relative.parts:
                  continue
              for line_no, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  if pattern.search(line):
                      matches.append(f"{path}:{line_no}:{line.strip()[:180]}")
          if matches:
              raise SystemExit("Legacy interview runtime frontend still referenced: " + " | ".join(matches[:20]))
          print("No legacy interview runtime references remain outside regression tests.")

      - name: Commit verified frontend cleanup
        run: |
          git config user.name "特昂糖糖糖"
          git config user.email "126449209+teangtang1122@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Remove legacy desktop creation interview flow"
          git push origin HEAD:codex/creation-agent-mobile-parity-3.2.1
