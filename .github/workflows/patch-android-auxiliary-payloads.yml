name: One-shot Android auxiliary payload patch

on:
  push:
    branches:
      - feat/android-pc-parity-3
    paths:
      - .github/workflows/patch-android-auxiliary-payloads.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/android-pc-parity-3
      - run: python .github/scripts/patch_android_auxiliary_payloads.py
      - run: |
          git rm \
            .github/scripts/patch_android_auxiliary_payloads.py \
            .github/workflows/patch-android-auxiliary-payloads.yml
          git add \
            mobile/android/app/src/main/java/com/siming/mobile/data/network/PcApiPayloads.kt \
            mobile/android/app/src/test/java/com/siming/mobile/data/network/PcAuxiliaryPayloadsTest.kt
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(android): project auxiliary records into sync outbox"
          git push origin HEAD:feat/android-pc-parity-3
