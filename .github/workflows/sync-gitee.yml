name: Sync mirror to Gitee

on:
  push:
    branches:
      - main
  release:
    types: [published]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Specific retained release tag to mirror (empty means the newest three)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sync-gitee
  cancel-in-progress: true

env:
  GITEE_OWNER: teangtang13
  GITEE_REPO: siming-ai
  GITEE_RELEASE_RETENTION_COUNT: "3"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Fetch all GitHub branches and tags
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail

          mirror_dir="${RUNNER_TEMP}/siming-ai-mirror.git"
          rm -rf "$mirror_dir"
          git init --bare "$mirror_dir"
          git -C "$mirror_dir" remote add github "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$mirror_dir" fetch --prune github \
            '+refs/heads/*:refs/heads/*' \
            '+refs/tags/*:refs/tags/*'

      - name: Configure and verify Gitee SSH
        env:
          GITEE_SSH_PRIVATE_KEY: ${{ secrets.GITEE_SSH_PRIVATE_KEY }}
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail

          ssh_dir="${RUNNER_TEMP}/gitee-ssh"
          install -m 700 -d "$ssh_dir"
          printf '%s\n' "$GITEE_SSH_PRIVATE_KEY" > "$ssh_dir/id_ed25519"
          chmod 600 "$ssh_dir/id_ed25519"
          ssh-keyscan -H gitee.com > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/known_hosts"

          ssh_output="$(ssh -i "$ssh_dir/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" -T git@gitee.com 2>&1 || true)"
          echo "$ssh_output"
          grep -Fq "$GITEE_OWNER" <<< "$ssh_output"

      - name: Repack Git objects
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail

          mirror_dir="${RUNNER_TEMP}/siming-ai-mirror.git"
          git -C "$mirror_dir" repack -a -d

      - name: Push branches to Gitee
        env:
          GIT_TERMINAL_PROMPT: "0"
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail

          mirror_dir="${RUNNER_TEMP}/siming-ai-mirror.git"
          ssh_dir="${RUNNER_TEMP}/gitee-ssh"
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o UserKnownHostsFile=$ssh_dir/known_hosts -o ServerAliveInterval=30 -o ServerAliveCountMax=3"
          git -C "$mirror_dir" remote add gitee "git@gitee.com:${GITEE_OWNER}/${GITEE_REPO}.git"
          git -C "$mirror_dir" push --progress --force --prune gitee \
            'refs/heads/*:refs/heads/*'

      - name: Push tags to Gitee
        env:
          GIT_TERMINAL_PROMPT: "0"
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail

          mirror_dir="${RUNNER_TEMP}/siming-ai-mirror.git"
          ssh_dir="${RUNNER_TEMP}/gitee-ssh"
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o UserKnownHostsFile=$ssh_dir/known_hosts -o ServerAliveInterval=30 -o ServerAliveCountMax=3"
          git -C "$mirror_dir" push --progress --force --prune gitee \
            'refs/tags/*:refs/tags/*'

      # A main-branch push happens before the tagged release has finished
      # building. Only mirror release metadata/assets from a release, schedule,
      # or explicit dispatch so "latest" cannot lag by one publication.
      - name: Check out release sync script
        if: github.event_name != 'push'
        uses: actions/checkout@v4

      - name: Install release sync dependency
        if: github.event_name != 'push'
        run: >-
          python -m pip install --disable-pip-version-check
          "requests>=2.32,<3"
          "requests-toolbelt>=1,<2"

      - name: Mirror GitHub Releases and assets
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          PYTHONUNBUFFERED: "1"
          SYNC_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event_name == 'release' && github.event.release.tag_name || '' }}
        run: python .github/scripts/sync_gitee_releases.py

      - name: Remove SSH credentials
        if: always()
        shell: bash
        run: rm -rf "${RUNNER_TEMP}/gitee-ssh"
