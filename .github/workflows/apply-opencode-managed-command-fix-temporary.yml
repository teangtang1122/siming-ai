name: Apply managed OpenCode MCP config fix

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.ref == 'agent/opencode-mcp-onboarding'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/opencode-mcp-onboarding
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply fix
        run: python scripts/apply-opencode-managed-command-fix.py
      - name: Validate patch
        run: |
          python -m compileall -q backend/app/services/external_agent/mcp_auto_config.py backend/tests/test_mcp_auto_config.py
          git diff --check
          python -m pip install -r backend/requirements.txt pytest
          cd backend
          python -m pytest -q tests/test_mcp_auto_config.py
      - name: Commit verified fix
        run: |
          rm scripts/apply-opencode-managed-command-fix.py
          rm .github/workflows/apply-opencode-managed-command-fix-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Support managed OpenCode MCP configuration"
          git push origin HEAD:agent/opencode-mcp-onboarding
