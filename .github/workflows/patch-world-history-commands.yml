name: One-shot world history command patch

on:
  push:
    branches:
      - feat/android-pc-parity-3
    paths:
      - .github/workflows/patch-world-history-commands.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/android-pc-parity-3
      - run: python .github/scripts/patch_world_history_commands.py
      - run: |
          git rm \
            .github/scripts/patch_world_history_commands.py \
            .github/workflows/patch-world-history-commands.yml
          git add \
            mobile/android/app/src/main/java/com/siming/mobile/data/network/PcApiPaths.kt \
            mobile/android/app/src/main/java/com/siming/mobile/data/network/GatewayApi.kt \
            mobile/android/app/src/main/java/com/siming/mobile/data/SimingRepository.kt \
            mobile/android/app/src/main/java/com/siming/mobile/ui/MainViewModel.kt \
            mobile/android/app/src/test/java/com/siming/mobile/data/network/PcWorldAdvancedPathsTest.kt
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(android): expose PC worldbuilding history"
          git push origin HEAD:feat/android-pc-parity-3
