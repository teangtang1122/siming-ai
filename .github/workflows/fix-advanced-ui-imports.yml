name: One-shot advanced UI import cleanup

on:
  push:
    branches:
      - feat/android-pc-parity-3
    paths:
      - .github/workflows/fix-advanced-ui-imports.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/android-pc-parity-3
      - run: python .github/scripts/fix_advanced_ui_imports.py
      - run: |
          git rm \
            .github/scripts/fix_advanced_ui_imports.py \
            .github/workflows/fix-advanced-ui-imports.yml
          git add mobile/android/app/src/main/java/com/siming/mobile/ui/AdvancedAuthoringDialogs.kt
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(android): clean advanced authoring UI imports"
          git push origin HEAD:feat/android-pc-parity-3
