name: One-shot Gateway character mutation refactor

on:
  push:
    branches:
      - feat/android-pc-contract-parity-2
    paths:
      - .github/workflows/refactor-gateway-character-mutation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/android-pc-contract-parity-2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python .github/scripts/refactor_gateway_character_mutation.py
      - run: python -m pip install 'ruff<1,>=0.11' && cd backend && python -m ruff check app/services/gateway_legacy_replication.py --fix
      - run: |
          git rm \
            .github/scripts/refactor_gateway_character_mutation.py \
            .github/workflows/refactor-gateway-character-mutation.yml
          git add backend/app/services/gateway_legacy_replication.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(gateway): isolate character mutation normalization"
          git push origin HEAD:feat/android-pc-contract-parity-2
