name: Apply OpenCode MCP architecture refactor

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.ref == 'agent/opencode-mcp-onboarding'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/opencode-mcp-onboarding
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply architecture refactor
        run: |
          python scripts/apply-opencode-mcp-architecture-refactor.py
          python scripts/trim-mcp-auto-config-after-refactor.py
          python scripts/fix-opencode-refactor-test-import.py

      - name: Syntax and diff checks
        run: |
          python -m compileall -q \
            backend/app/services/external_agent/mcp_auto_config.py \
            backend/app/services/external_agent/mcp_preflight.py \
            backend/app/services/cataloging/local_cli_agent.py \
            backend/app/services/cataloging/local_cli_mcp.py \
            backend/app/services/cataloging/local_cli_result.py \
            backend/app/routers/getting_started.py \
            backend/tests/test_mcp_auto_config.py \
            backend/tests/test_mcp_preflight.py \
            backend/tests/test_getting_started.py \
            backend/tests/test_local_cli_cataloging_agent.py
          git diff --check

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run architecture and regression checks
        working-directory: backend
        run: |
          python scripts/run_quality.py
          python -m pytest -q \
            tests/test_mcp_auto_config.py \
            tests/test_mcp_preflight.py \
            tests/test_getting_started.py \
            tests/test_local_cli_cataloging_agent.py

      - name: Commit verified refactor
        run: |
          rm scripts/apply-opencode-mcp-architecture-refactor.py
          rm scripts/trim-mcp-auto-config-after-refactor.py
          rm scripts/fix-opencode-refactor-test-import.py
          rm .github/workflows/apply-opencode-mcp-architecture-refactor-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Split OpenCode MCP runtime boundaries"
          git push origin HEAD:agent/opencode-mcp-onboarding
