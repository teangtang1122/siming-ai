name: Diagnose Android Creation Agent compile
on:
  push:
    branches: ["codex/creation-agent-mobile-parity-3.2.1"]
    paths: [".github/workflows/diagnose-android-creation-agent-compile.yml"]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/creation-agent-mobile-parity-3.2.1
      - name: Patch migration helper and apply
        shell: python
        run: |
          from pathlib import Path
          p = Path("scripts/migrate-creation-agent-parity.py")
          s = p.read_text(encoding="utf-8")
          old = '''    text = re.sub(
                  r"\\n\\s*private fun interviewHistoryWithAnswer\\([\\s\\S]*?(?=\\n\\s*private fun |\\n\\s*suspend fun |\\n\\s*fun )",
                  "\\n",
                  text,
                  count=1,
              )'''.replace('              ', '    ')
          new = '''    text = remove_between(
                  text,
                  "    private fun interviewHistoryWithAnswer(",
                  "    private suspend fun saveCreationSession(",
                  "interviewHistoryWithAnswer",
              )'''.replace('              ', '    ')
          if old not in s:
              raise RuntimeError("migration helper boundary marker missing")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          import subprocess
          subprocess.run(["python", "scripts/migrate-creation-agent-parity.py"], check=True)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps and regenerate contract
        run: |
          pip install -r backend/requirements.txt >/dev/null
          python scripts/export-mobile-prompt-contract.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - name: Compile and print concise errors
        working-directory: mobile/android
        shell: bash
        run: |
          set +e
          ./gradlew compileDebugKotlin --stacktrace --console=plain > /tmp/gradle.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "===== Kotlin compiler errors ====="
            grep -nE "(^e:| error: |Unresolved reference|Type mismatch|Cannot infer|No value passed|Too many arguments|Compilation error)" /tmp/gradle.log | tail -n 160 || true
            echo "===== Gradle tail ====="
            tail -n 100 /tmp/gradle.log
            exit "$code"
          fi
          tail -n 40 /tmp/gradle.log
