name: Apply conversational creation agent parity

on:
  push:
    branches: ["codex/creation-agent-mobile-parity-3.2.1"]
    paths:
      - ".github/workflows/apply-creation-agent-parity.yml"

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/creation-agent-mobile-parity-3.2.1
          fetch-depth: 0

      - name: Apply creation-agent control-plane migration
        shell: python
        run: |
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8")
          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")
          def replace_once(text, old, new, label):
              if old not in text:
                  raise RuntimeError(f"missing marker: {label}")
              return text.replace(old, new, 1)
          def remove_between(text, start, end, label):
              a = text.find(start)
              if a < 0:
                  raise RuntimeError(f"missing start: {label}")
              b = text.find(end, a)
              if b < 0:
                  raise RuntimeError(f"missing end: {label}")
              return text[:a] + text[b:]

          # ---- Export current PC Creation Agent prompt + tool schema to Android ----
          path = "scripts/export-mobile-prompt-contract.py"
          text = read(path)
          text = text.replace(
              "from app.services.novel_creation_prompting import (  # noqa: E402\n    COMPACT_CONCEPT_SHAPE,\n    CONCEPT_TASK_KINDS,\n    CONCEPT_TASK_RULES,\n    CONCEPT_USER_INTROS,\n    CREATION_STAGE_TASK_RULES,\n    CREATION_STAGE_USER_PREFIX,\n    CREATION_REPAIR_SYSTEM_PROMPT,\n    CREATION_REPAIR_USER_TEMPLATE,\n    NOVEL_INTERVIEW_SYSTEM_PROMPT,\n    NOVEL_INTERVIEW_USER_TEMPLATE,\n)\n",
              "from app.services.novel_creation_prompting import (  # noqa: E402\n    COMPACT_CONCEPT_SHAPE,\n    CONCEPT_TASK_KINDS,\n    CONCEPT_TASK_RULES,\n    CONCEPT_USER_INTROS,\n    CREATION_STAGE_TASK_RULES,\n    CREATION_STAGE_USER_PREFIX,\n    CREATION_REPAIR_SYSTEM_PROMPT,\n    CREATION_REPAIR_USER_TEMPLATE,\n)\nfrom app.services.novel_creation_agent import (  # noqa: E402\n    CREATION_AGENT_TOOLS,\n    _system_prompt as creation_agent_system_prompt,\n    _tool_schemas as creation_agent_tool_schemas,\n)\n",
          )
          marker = '        "creation": {\n'
          if marker not in text:
              raise RuntimeError("creation contract marker missing")
          text = text.replace(
              marker,
              '        "creation_agent": {\n'
              '            "system_template": creation_agent_system_prompt("{{session_id}}"),\n'
              '            "tool_names": sorted(CREATION_AGENT_TOOLS),\n'
              '            "tool_schemas": creation_agent_tool_schemas(),\n'
              '            "max_iterations": 6,\n'
              '        },\n'
              + marker,
              1,
          )
          text = text.replace('            "interview_max_turns": 8,\n', '')
          text = text.replace('            "interview_system_prompt": NOVEL_INTERVIEW_SYSTEM_PROMPT,\n', '')
          text = text.replace('            "interview_user_template": NOVEL_INTERVIEW_USER_TEMPLATE,\n', '')
          write(path, text)

          # ---- Delete PC dynamic-interview API/control plane; current Agent is canonical ----
          path = "backend/app/routers/novel_creation.py"
          text = read(path)
          text = text.replace("    advance_novel_creation_interview,\n", "")
          text = remove_between(
              text,
              "class NovelCreationInterviewNextRequest(BaseModel):\n",
              "class NovelCreationReviewRequest(BaseModel):\n",
              "legacy interview request model",
          )
          text = remove_between(
              text,
              '@router.post("/novel-creation/sessions/{session_id}/interview/next")\n',
              '@router.post("/novel-creation/review")\n',
              "legacy interview endpoint",
          )
          text = remove_between(
              text,
              "class RefreshQuestionRequest(BaseModel):\n",
              "class SystemChatRequest(BaseModel):\n",
              "legacy interview option endpoint",
          )
          old_agent = '''class CreationAgentRequest(BaseModel):
              session_id: str
              message: str = Field(min_length=1, max_length=1_000_000)
              model: str | None = None
              history: list[dict[str, str]] = Field(default_factory=list, max_length=20)
              local_cli_permission_grant: Literal["chat_only", "creation_agent_once"] = "chat_only"
              local_cli_read_permission_grant: Literal["none", "read_once"] = "none"
              local_cli_read_paths: list[str] = Field(default_factory=list, max_length=8)
          '''.replace('              ', '    ')
          new_agent = '''class CreationAgentRequest(BaseModel):
              session_id: str
              message: str = Field(min_length=1, max_length=1_000_000)
              model: str | None = None
              history: list[dict[str, str]] = Field(default_factory=list, max_length=20)
              model_route: Literal["pc", "mobile"] = "pc"
              mobile_provider: MobileProviderEnvelope | None = Field(default=None, repr=False, exclude=True)
              local_cli_permission_grant: Literal["chat_only", "creation_agent_once"] = "chat_only"
              local_cli_read_permission_grant: Literal["none", "read_once"] = "none"
              local_cli_read_paths: list[str] = Field(default_factory=list, max_length=8)

              @model_validator(mode="after")
              def require_mobile_provider_envelope(self) -> "CreationAgentRequest":
                  if self.model_route == "mobile" and self.mobile_provider is None:
                      raise ValueError("选择手机模型线路时必须提供加密凭据")
                  if self.model_route == "pc" and self.mobile_provider is not None:
                      raise ValueError("PC 模型线路不能携带手机模型凭据")
                  return self
          '''.replace('              ', '    ')
          text = replace_once(text, old_agent, new_agent, "CreationAgentRequest")
          old_endpoint = '''@router.post("/novel-creation/agent-turn")
          async def creation_agent_turn(payload: CreationAgentRequest, db: Session = Depends(get_db)):
              session = novel_creation_session_store(db).session(payload.session_id)
              if not session:
                  raise HTTPException(status_code=404, detail="立项草稿不存在")
              from ..services.novel_creation_agent import run_creation_agent

              result = await run_creation_agent(
                  db,
                  session=session,
                  message=payload.message,
                  model=payload.model,
                  history=payload.history,
                  local_cli_write_granted=payload.local_cli_permission_grant == "creation_agent_once",
                  local_cli_read_paths=(
                      list(payload.local_cli_read_paths)
                      if payload.local_cli_read_permission_grant == "read_once" else []
                  ),
              )
              return ApiResponse.success(data=result)
          '''.replace('          ', '')
          new_endpoint = '''@router.post("/novel-creation/agent-turn")
          async def creation_agent_turn(
              payload: CreationAgentRequest,
              request: Request,
              db: Session = Depends(get_db),
          ):
              session = novel_creation_session_store(db).session(payload.session_id)
              if not session:
                  raise HTTPException(status_code=404, detail="立项草稿不存在")
              from ..services.novel_creation_agent import run_creation_agent

              request_provider = _resolve_mobile_creation_provider(
                  db,
                  payload,
                  request,
                  binding_id=session.id,
              )

              async def run_agent() -> dict[str, Any]:
                  return await run_creation_agent(
                      db,
                      session=session,
                      message=payload.message,
                      model=payload.model,
                      history=payload.history,
                      local_cli_write_granted=payload.local_cli_permission_grant == "creation_agent_once",
                      local_cli_read_paths=(
                          list(payload.local_cli_read_paths)
                          if payload.local_cli_read_permission_grant == "read_once" else []
                      ),
                  )

              if request_provider is None:
                  result = await run_agent()
              else:
                  from ..modules.model_runtime.application.request_override import use_request_provider
                  with use_request_provider(request_provider):
                      result = await run_agent()
              return ApiResponse.success(data=result)
          '''.replace('          ', '')
          text = replace_once(text, old_endpoint, new_endpoint, "creation agent endpoint")
          write(path, text)

          # Remove the old interview engine imports/functions and dedicated module/tests.
          path = "backend/app/services/workspace/tools/novel_creation.py"
          text = read(path)
          text = re.sub(
              r'from \.\.\.novel_creation_interview import \([\s\S]*?\)\n',
              '',
              text,
              count=1,
          )
          for name in ("advance_novel_creation_interview", "refresh_question_options"):
              pattern = rf'\n(?:async )?def {name}\([\s\S]*?(?=\n(?:async )?def [A-Za-z_]|\n__all__|\Z)'
              text, count = re.subn(pattern, '\n', text, count=1)
              if count != 1:
                  raise RuntimeError(f"legacy function not found: {name}")
          write(path, text)
          for old in (
              "backend/app/services/novel_creation_interview.py",
              "backend/tests/test_novel_creation_interview.py",
          ):
              p = Path(old)
              if p.exists(): p.unlink()

          # Remove canonical interview-only prompts/message builder.
          path = "backend/app/services/novel_creation_prompting.py"
          text = read(path)
          start = text.index("NOVEL_INTERVIEW_SYSTEM_PROMPT = (")
          end = text.index("COMPACT_CONCEPT_SHAPE", start)
          text = text[:start] + text[end:]
          start = text.index("def build_novel_interview_messages(")
          end = text.index("def build_compact_concept_messages(", start)
          text = text[:start] + text[end:]
          text = text.replace('    "NOVEL_INTERVIEW_SYSTEM_PROMPT",\n', '')
          text = text.replace('    "NOVEL_INTERVIEW_USER_TEMPLATE",\n', '')
          text = text.replace('    "build_novel_interview_messages",\n', '')
          write(path, text)

          # ---- Android DirectApi agent turns get provider-specific request body options ----
          path = "mobile/android/app/src/main/java/com/siming/mobile/data/network/DirectApi.kt"
          text = read(path)
          text = replace_once(
              text,
              '''        maxOutputTokens: Int = 4_000,
                  temperature: Double = 0.3,
              ): DirectAgentTurn {'''.replace('              ', '    '),
              '''        maxOutputTokens: Int = 4_000,
                  temperature: Double = 0.3,
                  extraBody: JsonObject? = null,
              ): DirectAgentTurn {'''.replace('              ', '    '),
              "agentTurn extraBody",
          )
          text = text.replace(
              "responsesAgentPayload(config, messages, tools, toolChoice, maxOutputTokens, temperature)",
              "responsesAgentPayload(config, messages, tools, toolChoice, maxOutputTokens, temperature, extraBody)",
          )
          text = text.replace(
              "chatAgentPayload(config, messages, tools, toolChoice, maxOutputTokens, temperature)",
              "chatAgentPayload(config, messages, tools, toolChoice, maxOutputTokens, temperature, extraBody)",
          )
          text = replace_once(
              text,
              '''        maxOutputTokens: Int,
                  temperature: Double,
              ): JsonObject = buildJsonObject {'''.replace('              ', '    '),
              '''        maxOutputTokens: Int,
                  temperature: Double,
                  extraBody: JsonObject?,
              ): JsonObject = buildJsonObject {'''.replace('              ', '    '),
              "chat payload signature",
          )
          text = replace_once(
              text,
              '''        put("stream", false)
              }

              private fun responsesAgentPayload('''.replace('              ', '    '),
              '''        put("stream", false)
                  extraBody?.forEach { (key, value) -> put(key, value) }
              }

              private fun responsesAgentPayload('''.replace('              ', '    '),
              "chat payload body",
          )
          text = replace_once(
              text,
              '''        maxOutputTokens: Int,
                  temperature: Double,
              ): JsonObject {'''.replace('              ', '    '),
              '''        maxOutputTokens: Int,
                  temperature: Double,
                  extraBody: JsonObject?,
              ): JsonObject {'''.replace('              ', '    '),
              "responses payload signature",
          )
          text = replace_once(
              text,
              '''            put("stream", false)
                  }
              }

              private fun parseChatAgentTurn'''.replace('              ', '    '),
              '''            put("stream", false)
                      extraBody?.forEach { (key, value) -> put(key, value) }
                  }
              }

              private fun parseChatAgentTurn'''.replace('              ', '    '),
              "responses payload body",
          )
          write(path, text)

          # ---- Android stage engine becomes a lower-level Creation Agent tool, not an interview wizard ----
          path = "mobile/android/app/src/main/java/com/siming/mobile/data/creation/MobileCreationAgent.kt"
          text = read(path)
          text = remove_between(text, "    suspend fun interview(\n", "    suspend fun generateStage(\n", "android legacy interview")
          text = remove_between(text, "    private fun withInterview(\n", "    private fun writeStage(\n", "android interview state writer")
          marker = "    fun confirmStage(source: JsonObject, stage: String, editedData: JsonObject? = null): JsonObject {"
          replacement = '''    internal fun replaceArtifact(
              source: JsonObject,
              stage: String,
              data: JsonObject,
              sourceLabel: String = "assistant",
          ): JsonObject {
              require(stage in contract.stageOrder) { "未知立项阶段" }
              validateStage(stage, data)
              validateAuthorRequirements(stage, data, baseline(source, stage), source.objectValue("draft"))
              return writeStage(source, stage, data, status = "generated", sourceLabel = sourceLabel)
          }

          '''.replace('          ', '') + marker
          text = replace_once(text, marker, replacement, "replaceArtifact insertion")
          write(path, text)

          # Remove interview-only projection from Android prompt adapter.
          path = "mobile/android/app/src/main/java/com/siming/mobile/data/creation/PcCreationPromptContract.kt"
          text = read(path)
          text = re.sub(r'\n\s*val interviewMaxTurns: Int =[\s\S]*?\n\s*val stageOrder:', '\n    val stageOrder:', text, count=1)
          text = re.sub(r'\n\s*fun interviewMessages\([\s\S]*?\n\s*fun conceptMessages\(', '\n\n    fun conceptMessages(', text, count=1)
          text = text.replace(
              '            put("interview_history", interview["history"] ?: JsonArray(emptyList()))\n            put("interview_reason", interview.string("reason"))',
              '            put("interview_history", draft["agent_history"] ?: JsonArray(emptyList()))\n            put("interview_reason", "")',
          )
          text = text.replace('        val interview = draft.objectValue("interview")\n', '')
          write(path, text)

          # Delete Android interview-only reliability code/tests.
          for old in (
              "mobile/android/app/src/main/java/com/siming/mobile/data/creation/MobileCreationInterviewReliability.kt",
              "mobile/android/app/src/test/java/com/siming/mobile/data/creation/MobileCreationInterviewReliabilityTest.kt",
          ):
              p = Path(old)
              if p.exists(): p.unlink()

          # ---- Gateway Android calls the same /agent-turn endpoint, including phone-owned key route ----
          path = "mobile/android/app/src/main/java/com/siming/mobile/data/network/PcApiPaths.kt"
          text = read(path)
          text = text.replace('    const val NOVEL_CREATION_APPLY = "$NOVEL_CREATION/apply"\n', '    const val NOVEL_CREATION_APPLY = "$NOVEL_CREATION/apply"\n    const val NOVEL_CREATION_AGENT_TURN = "$NOVEL_CREATION/agent-turn"\n')
          text = re.sub(r'\n\s*fun novelCreationInterview\([\s\S]*?\n\s*fun novelCreationRuns', '\n\n    fun novelCreationRuns', text, count=1)
          write(path, text)

          path = "mobile/android/app/src/main/java/com/siming/mobile/data/network/GatewayApi.kt"
          text = read(path)
          text = re.sub(r'\n\s*suspend fun advanceNovelCreationInterview\([\s\S]*?\n\s*suspend fun startNovelCreationRun', '\n\n    suspend fun startNovelCreationRun', text, count=1)
          insert = '''
              suspend fun novelCreationAgentTurn(
                  connection: GatewayConnection,
                  payload: JsonObject,
              ): JsonObject = request<ApiEnvelope<JsonObject>>(
                  connection.baseUrl,
                  PcApiPaths.NOVEL_CREATION_AGENT_TURN,
                  "POST",
                  json.encodeToString(payload),
              ).data

          '''.replace('          ', '')
          marker = "    suspend fun startNovelCreationRun("
          if marker not in text: raise RuntimeError("Gateway run marker missing")
          text = text.replace(marker, insert + marker, 1)
          write(path, text)

          # ---- Repository replaces interview/stage wizard orchestration with conversational agent turns ----
          path = "mobile/android/app/src/main/java/com/siming/mobile/data/SimingRepository.kt"
          text = read(path)
          text = text.replace(
              'import com.siming.mobile.data.creation.MobileCreationAgent\n',
              'import com.siming.mobile.data.creation.MobileCreationAgent\nimport com.siming.mobile.data.creation.MobileCreationConversationAgent\n',
          )
          marker = '    private val mobileCreationAgent by lazy { MobileCreationAgent(appContext, directApi) }\n'
          addition = marker + '''    private val mobileCreationConversationAgent by lazy {
              MobileCreationConversationAgent(
                  context = appContext,
                  stageAgent = mobileCreationAgent,
                  directApi = directApi,
                  persistSession = ::saveCreationSession,
                  finalizeSession = { session ->
                      saveCreationSession(session)
                      val projectId = archiveCreation(session.string("id")) {}
                      loadCreationSession(session.string("id")) to projectId
                  },
              )
          }
          '''.replace('          ', '')
          text = replace_once(text, marker, addition, "mobile conversation agent lazy")
          start = text.index("    suspend fun advanceCreationInterview(\n")
          end = text.index("    suspend fun archiveCreation(\n", start)
          new_block = '''    suspend fun runCreationAgentTurn(
              sessionId: String,
              message: String,
              onProgress: suspend (String) -> Unit = {},
          ): JsonObject {
              require(message.isNotBlank()) { "请输入你想告诉 AI 的内容" }
              val current = loadCreationSession(sessionId)
              val history = creationAgentHistory(current)
              val userHistory = history + agentHistoryMessage("user", message)
              saveCreationSession(withCreationAgentHistory(current, userHistory))
              val route = creationRoute(current)
              val gatewayExecution = creationHost(current) == CREATION_HOST_GATEWAY
              val updated = try {
                  when {
                      route == CreationExecutionRoute.Pc || gatewayExecution -> {
                          val connection = requireConnection()
                          val mobileProvider = if (route == CreationExecutionRoute.MobileKey) {
                              mobileProviderPayload(connection, sessionId)
                          } else null
                          onProgress(if (mobileProvider == null) "PC Creation Agent 正在读取并增量写入…" else "手机 Key 正在驱动 PC Creation Agent…")
                          val result = api.novelCreationAgentTurn(
                              connection,
                              buildJsonObject {
                                  put("session_id", sessionId)
                                  put("message", message)
                                  put("history", JsonArray(history.takeLast(12)))
                                  put("model_route", if (mobileProvider == null) "pc" else "mobile")
                                  mobileProvider?.let { put("mobile_provider", it) }
                              },
                          )
                          val reply = result.string("reply").ifBlank { "已完成本轮立项工具调用" }
                          val fresh = tagCreationRoute(
                              api.getNovelCreationSession(connection, sessionId),
                              route,
                              CREATION_HOST_GATEWAY,
                          )
                          withCreationAgentHistory(fresh, userHistory + agentHistoryMessage("assistant", reply))
                      }
                      else -> {
                          onProgress("手机 Creation Agent 正在读取资料并执行工具…")
                          val result = mobileCreationConversationAgent.run(
                              source = current,
                              message = message,
                              history = history,
                              config = resolvedDirectConfig(),
                              onProgress = onProgress,
                          )
                          withCreationAgentHistory(
                              result.session,
                              userHistory + agentHistoryMessage("assistant", result.reply),
                          )
                      }
                  }
              } catch (error: Exception) {
                  // User text was persisted before the model call. Keep it on failure.
                  throw error
              }
              saveCreationSession(updated)
              return updated
          }

          '''.replace('          ', '')
          text = text[:start] + new_block + text[end:]
          # Remove legacy helper used only by the interview endpoint.
          text = re.sub(r'\n\s*private fun interviewHistoryWithAnswer\([\s\S]*?(?=\n\s*private fun |\n\s*suspend fun |\n\s*fun )', '\n', text, count=1)
          # Add local chat-history helpers before saveCreationSession.
          marker = "    private suspend fun saveCreationSession(session: JsonObject) {"
          helpers = '''    private fun creationAgentHistory(session: JsonObject): List<JsonObject> =
              (session.draft()["agent_history"] as? JsonArray)
                  .orEmpty()
                  .mapNotNull { it as? JsonObject }

              private fun agentHistoryMessage(role: String, content: String): JsonObject = buildJsonObject {
                  put("id", UUID.randomUUID().toString())
                  put("role", role)
                  put("content", content)
                  put("created_at", Instant.now().toString())
              }

              private fun withCreationAgentHistory(session: JsonObject, history: List<JsonObject>): JsonObject {
                  val draft = session.draft().toMutableMap()
                  draft["agent_history"] = JsonArray(history.takeLast(40))
                  return JsonObject(session.toMutableMap().apply { put("draft", JsonObject(draft)) })
              }

          '''.replace('              ', '    ')
          text = replace_once(text, marker, helpers + marker, "creation agent history helpers")
          write(path, text)

          # ---- MainViewModel exposes one chat action instead of interview/generate/confirm wizard actions ----
          path = "mobile/android/app/src/main/java/com/siming/mobile/ui/MainViewModel.kt"
          text = read(path)
          start = text.index("    fun beginCreation(input: CreationStartInput, route: CreationExecutionRoute) {\n")
          end = text.index("    fun archiveCreation(sessionId: String, onArchived: (String) -> Unit) {\n", start)
          replacement = '''    fun beginCreation(input: CreationStartInput, route: CreationExecutionRoute) {
              launchCreation("正在建立对话式立项会话…") {
                  val started = repository.beginCreation(input, route)
                  val sessionId = started["id"]?.jsonPrimitive?.contentOrNull
                      ?: error("立项草稿缺少 id")
                  uiState.value = uiState.value.copy(activeCreationId = sessionId)
                  repository.runCreationAgentTurn(sessionId, input.brief) { activity ->
                      uiState.value = uiState.value.copy(creationActivity = activity)
                  }
                  "Creation Agent 已边聊边写入第一轮立项资料"
              }
          }

              fun resumeCreation(sessionId: String) {
                  uiState.value = uiState.value.copy(activeCreationId = sessionId, error = null)
              }

              fun closeCreation() {
                  uiState.value = uiState.value.copy(activeCreationId = null, creationActivity = "")
              }

              fun sendCreationMessage(sessionId: String, message: String) {
                  if (message.isBlank()) return
                  launchCreation("Creation Agent 正在处理…") {
                      repository.runCreationAgentTurn(sessionId, message) { activity ->
                          uiState.value = uiState.value.copy(creationActivity = activity)
                      }
                      "本轮已完成；确定事实已立即写入结构化立项资料"
                  }
              }

          '''.replace('              ', '    ')
          text = text[:start] + replacement + text[end:]
          # The old manual archive button is no longer the primary UX, but keep method for the local finalize tool callback only.
          write(path, text)

          # ---- Route active Android creation sessions to the chat-first workspace ----
          path = "mobile/android/app/src/main/java/com/siming/mobile/ui/CreationScreen.kt"
          text = read(path)
          old = '''        active != null -> CreationWorkspace(
              modifier = modifier,
              session = active,
              stages = stages,
              running = ui.creationRunning,
              activity = ui.creationActivity,
              onBack = viewModel::closeCreation,
              onAnswer = { answer, skip -> viewModel.answerCreationInterview(active.string("id"), answer, skip) },
              onGenerate = { stage, instruction -> viewModel.generateCreationStage(active.string("id"), stage, instruction) },
              onConfirm = { stage, edited -> viewModel.confirmCreationStage(active.string("id"), stage, edited) },
              onArchive = { viewModel.archiveCreation(active.string("id"), onOpenProject) },
              onDiscard = { viewModel.discardCreation(active.string("id")) },
          )'''.replace('          ', '')
          new = '''        active != null -> CreationConversationWorkspace(
              modifier = modifier,
              session = active,
              stages = stages,
              running = ui.creationRunning,
              activity = ui.creationActivity,
              onBack = viewModel::closeCreation,
              onSend = { message -> viewModel.sendCreationMessage(active.string("id"), message) },
              onDiscard = { viewModel.discardCreation(active.string("id")) },
              onOpenProject = onOpenProject,
          )'''.replace('          ', '')
          text = replace_once(text, old, new, "CreationScreen active route")
          text = text.replace("AI 通过追问，与我一起找到可持续的创意", "AI 边聊边写入资料，与我一起找到可持续的创意")
          text = text.replace("两条线路使用同一套 V3 提示词和建档结构。", "两条线路使用同一套对话式 Creation Agent 提示词、工具和建档结构。")
          text = text.replace("PC 同源提示词", "PC 同源 Agent")
          text = text.replace(
              "接下来 AI 会动态采访 → 生成一套创意方向 → 搭建世界、角色、地点与卷纲 → 你可以先建档，也可以继续生成可选的前三章细纲。",
              "接下来直接进入对话式立项：AI 每轮先读当前资料，把确定事实立即写入，再问最有价值的下一件事；角色、世界观和大纲不再有强制顺序。",
          )
          text = text.replace(
              "司命会追问真正影响故事的分岔，再把结果变成可编辑、可确认、可正式入库的作品资料。",
              "司命会像 PC 端一样边聊边读取和写入作品资料；你每确认一个事实，它就立即进入结构化草稿。",
          )
          text = text.replace('listOf("动态采访", "结构化生成", "逐步可撤回", "一键建档")', 'listOf("即时写入", "按需追问", "任意顺序", "一键建档")')
          write(path, text)

          # Fix local conversation loop: break after final model reply and robust boolean check.
          path = "mobile/android/app/src/main/java/com/siming/mobile/data/creation/MobileCreationConversationAgent.kt"
          text = read(path)
          text = text.replace(
              '        var finalReply = ""\n        repeat(contract.maxIterations) { iteration ->',
              '        var finalReply = ""\n        var iteration = 0\n        while (iteration < contract.maxIterations && finalReply.isBlank()) {',
          )
          text = text.replace('                return@repeat\n', '                break\n')
          text = text.replace('            }\n        }\n\n        if (finalReply.isBlank() && toolResults.isNotEmpty()) {', '            }\n            iteration += 1\n        }\n\n        if (finalReply.isBlank() && toolResults.isNotEmpty()) {', 1)
          text = text.replace('                if (!(validation["ready"] as? JsonPrimitive)?.contentOrNull.toBoolean()) {', '                if ((validation["ready"] as? JsonPrimitive)?.contentOrNull?.toBooleanStrictOrNull() != true) {')
          write(path, text)

          # Add test proving the mobile asset now contains the PC Creation Agent control plane.
          test_path = Path("mobile/android/app/src/test/java/com/siming/mobile/data/creation/PcCreationAgentContractTest.kt")
          test_path.write_text('''package com.siming.mobile.data.creation

          import kotlin.test.Test
          import kotlin.test.assertTrue

          class PcCreationAgentContractTest {
              @Test
              fun currentPcCreationAgentPromptRequiresImmediateIncrementalWrites() {
                  val raw = javaClass.classLoader!!.getResource("pc_workspace_prompt_contract.json")!!.readText()
                  val contract = PcCreationAgentContract(raw)
                  val prompt = contract.systemPrompt("session-test")
                  assertTrue("立即增量写入" in prompt)
                  assertTrue("不要把数据积攒到“采访结束”后才生成" in prompt)
                  assertTrue("patch_creation_artifact" in contract.toolNames)
                  assertTrue("generate_creation_artifact" in contract.toolNames)
              }
          }
          '''.replace('          ', ''), encoding="utf-8")

      - name: Regenerate Android prompt contract from current PC sources
        run: python scripts/export-mobile-prompt-contract.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend test dependencies
        run: pip install -r backend/requirements.txt

      - name: Verify current PC Creation Agent and removed interview endpoint
        working-directory: backend
        run: |
          python -m pytest tests/test_novel_creation_agent.py -q
          python - <<'PY'
          from app.main import app
          paths = {route.path for route in app.routes}
          assert "/api/v1/novel-creation/agent-turn" in paths
          assert "/api/v1/novel-creation/sessions/{session_id}/interview/next" not in paths
          assert "/api/v1/novel-creation/refresh-question" not in paths
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Test Android conversational creation flow
        working-directory: mobile/android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Guard against old interview control-plane references
        run: |
          if grep -RInE "advanceCreationInterview|answerCreationInterview|MobileCreationInterviewReliability|novelCreationInterview\(" mobile/android/app/src/main mobile/android/app/src/test; then
            echo "Android legacy interview path still referenced" >&2; exit 1
          fi
          if grep -RInE "advance_novel_creation_interview|NovelCreationInterviewNextRequest|/interview/next|refresh_question_options|NOVEL_INTERVIEW_" backend/app; then
            echo "Backend legacy interview path still referenced" >&2; exit 1
          fi

      - name: Commit verified migration
        run: |
          git config user.name "特昂糖糖糖"
          git config user.email "126449209+teangtang1122@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Align Android with conversational creation agent"
          git push origin HEAD:codex/creation-agent-mobile-parity-3.2.1
