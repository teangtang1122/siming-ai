name: Temporary release lock refresh

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.event.pull_request.head.ref == 'release/3.3.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/3.3.0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh release lock metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/package-lock.json')
          text = path.read_text(encoding='utf-8')
          top = '{\n  "name": "siming-frontend",\n  "version": "3.2.1",'
          root = '    "": {\n      "name": "siming-frontend",\n      "version": "3.2.1",'
          if text.count(top) != 1:
              raise SystemExit(f'top-level lock version anchor mismatch: {text.count(top)}')
          if text.count(root) != 1:
              raise SystemExit(f'root package lock version anchor mismatch: {text.count(root)}')
          text = text.replace(top, top.replace('3.2.1', '3.3.0'), 1)
          text = text.replace(root, root.replace('3.2.1', '3.3.0'), 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Diagnose and repair npm lock install tree
        working-directory: frontend
        run: |
          set -euxo pipefail
          npm cache clean --force
          npm ci --include=dev --prefer-online
          echo "omit=$(npm config get omit)"
          echo "include=$(npm config get include)"
          node - <<'NODE'
          const lock = require('./package-lock.json')
          console.log('root devDependency:', lock.packages[''].devDependencies['eslint-plugin-react-hooks'])
          console.log('lock entry:', JSON.stringify(lock.packages['node_modules/eslint-plugin-react-hooks'], null, 2))
          NODE
          npm ls eslint-plugin-react-hooks --all || true
          npm explain eslint-plugin-react-hooks || true
          if [ ! -f node_modules/eslint-plugin-react-hooks/package.json ]; then
            echo "react-hooks missing after npm ci; refreshing its lock edge"
            npm install --save-dev --package-lock-only --ignore-scripts eslint-plugin-react-hooks@4.6.2
            rm -rf node_modules
            npm cache clean --force
            npm ci --include=dev --prefer-online
          fi
          test -f node_modules/eslint-plugin-react-hooks/package.json
          npm run lint
          npm test
          npm run architecture
          npm run build

      - name: Commit verified lock refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/release-lock-refresh-temporary.yml
          git add frontend/package-lock.json
          git diff --cached --check
          git commit -m 'chore(release): refresh frontend lock metadata for 3.3.0'
          git push origin HEAD:release/3.3.0
