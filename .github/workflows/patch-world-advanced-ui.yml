name: One-shot worldbuilding advanced UI patch

on:
  push:
    branches:
      - feat/android-pc-parity-3
    paths:
      - .github/workflows/patch-world-advanced-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/android-pc-parity-3
      - run: python .github/scripts/patch_world_advanced_ui.py
      - run: |
          git rm \
            .github/scripts/patch_world_advanced_ui.py \
            .github/workflows/patch-world-advanced-ui.yml
          git add \
            mobile/android/app/src/main/java/com/siming/mobile/ui/AdvancedAuthoringDialogs.kt \
            mobile/android/app/src/main/java/com/siming/mobile/ui/SimingApp.kt
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(android): show PC worldbuilding versions and timeline"
          git push origin HEAD:feat/android-pc-parity-3
