name: Gateway Container

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "Dockerfile"
      - "compose.gateway.yml"
      - ".dockerignore"
      - ".github/workflows/gateway-image.yml"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "backend/**"
      - "frontend/**"
      - "Dockerfile"
      - "compose.gateway.yml"
      - ".dockerignore"
      - ".github/workflows/gateway-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/siming-ai-gateway"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            frontend_version="$(jq -r '.version' frontend/package.json)"
            backend_version="$(sed -nE 's/^APP_VERSION = "([^"]+)"/\1/p' backend/app/version.py)"
            android_version="$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' mobile/android/app/build.gradle.kts | head -n 1)"
            if [[ "${tag}" != "v${frontend_version}" || "${frontend_version}" != "${backend_version}" || "${frontend_version}" != "${android_version}" ]]; then
              echo "Tag ${tag} must match frontend/backend/Android version (${frontend_version}/${backend_version}/${android_version})." >&2
              exit 1
            fi
            major_minor="${version%.*}"
            {
              echo "tags<<EOF"
              echo "${image}:${version}"
              echo "${image}:${major_minor}"
              echo "${image}:latest"
              echo "EOF"
              echo "version=${version}"
            } >> "$GITHUB_OUTPUT"
          else
            echo "tags=${image}:ci-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "version=ci-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build amd64 smoke image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: siming-gateway:smoke-amd64
          build-args: SIMING_VERSION=${{ steps.meta.outputs.version }}

      - name: Build arm64 smoke image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/arm64
          tags: siming-gateway:smoke-arm64
          build-args: SIMING_VERSION=${{ steps.meta.outputs.version }}

      - name: Smoke test every supported architecture
        shell: bash
        run: |
          set -euo pipefail
          containers=()
          cleanup() {
            for container in "${containers[@]}"; do
              docker rm -f "$container" >/dev/null 2>&1 || true
            done
          }
          trap cleanup EXIT

          smoke_arch() {
            local arch="$1"
            local port="$2"
            local image="siming-gateway:smoke-${arch}"
            local container="siming-gateway-smoke-${arch}"
            test "$(docker image inspect --format '{{.Architecture}}' "$image")" = "$arch"
            docker run -d --rm --platform "linux/${arch}" --name "$container" \
              -e SIMING_GATEWAY_BOOTSTRAP_KEY=ci-bootstrap-key-12345 \
              -p "${port}:8000" "$image"
            containers+=("$container")
            for attempt in {1..30}; do
              if curl --fail --silent "http://127.0.0.1:${port}/health" >/dev/null; then break; fi
              sleep 2
            done
            curl --fail --silent "http://127.0.0.1:${port}/health"
            test "$(docker exec "$container" id -u)" = "10001"
            docker exec "$container" sh -c 'touch /data/ci-write-test && test ! -w /app'
            docker rm -f "$container" >/dev/null
          }

          smoke_arch amd64 18000
          smoke_arch arm64 18001

      - name: Build and publish multi-architecture image
        if: github.ref_type == 'tag'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: SIMING_VERSION=${{ steps.meta.outputs.version }}
          provenance: mode=max
          sbom: true
