name: Temporary Android mobile UI redesign

on:
  pull_request:
    branches:
      - develop
    paths:
      - "mobile/android/**"
      - "scripts/patch-android-mobile-ui-redesign.py"
      - ".github/workflows/apply-android-mobile-ui-redesign-temporary.yml"

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.ref == 'feature/android-mobile-ui-redesign'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/android-mobile-ui-redesign
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Apply mobile UI redesign shell
        run: |
          set -euo pipefail
          python scripts/patch-android-mobile-ui-redesign.py
          git diff --check

      - name: Validate parity contract
        run: python scripts/check-mobile-pc-parity.py --check-doc docs/mobile-pc-parity.md

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Test, lint, and build Android
        working-directory: mobile/android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Commit verified implementation
        run: |
          set -euo pipefail
          rm -f scripts/patch-android-mobile-ui-redesign.py
          rm -f .github/workflows/apply-android-mobile-ui-redesign-temporary.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style(android): redesign mobile library and project shell'
          git push origin HEAD:feature/android-mobile-ui-redesign
