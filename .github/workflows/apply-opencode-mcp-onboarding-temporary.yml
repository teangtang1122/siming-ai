name: Apply OpenCode MCP onboarding patch

on:
  push:
    branches:
      - agent/opencode-mcp-onboarding
    paths:
      - scripts/apply-opencode-mcp-onboarding-patch.py
      - .github/workflows/apply-opencode-mcp-onboarding-temporary.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/opencode-mcp-onboarding
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply patch
        run: python scripts/apply-opencode-mcp-onboarding-patch.py

      - name: Syntax and diff checks
        run: |
          python -m compileall -q \
            backend/app/services/external_agent/mcp_auto_config.py \
            backend/app/routers/getting_started.py \
            backend/app/services/cataloging/local_cli_agent.py \
            backend/tests/test_mcp_auto_config.py \
            backend/tests/test_getting_started.py \
            backend/tests/test_local_cli_cataloging_agent.py
          git diff --check

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run backend regressions
        working-directory: backend
        run: pytest -q tests/test_mcp_auto_config.py tests/test_getting_started.py tests/test_local_cli_cataloging_agent.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Commit verified implementation
        run: |
          rm scripts/apply-opencode-mcp-onboarding-patch.py
          rm .github/workflows/apply-opencode-mcp-onboarding-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve OpenCode MCP onboarding and cataloging"
          git push origin HEAD:agent/opencode-mcp-onboarding
