name: One-shot chapter order patch

on:
  push:
    branches:
      - feature/independent-chapter-order
    paths:
      - scripts/one_shot_chapter_order_patch.py
      - .github/workflows/one-shot-chapter-order.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/independent-chapter-order
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply independent chapter order patch
        run: python scripts/one_shot_chapter_order_patch.py

      - name: Validate generated sources
        run: |
          python -m compileall -q backend/app backend/alembic
          git diff --check

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: decouple chapter order from outline order"
          git push origin HEAD:feature/independent-chapter-order
