name: Verify creation agent parity migration

on:
  push:
    branches: ["codex/creation-agent-mobile-parity-3.2.1"]
    paths:
      - ".github/workflows/apply-creation-agent-parity-v4.yml"

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/creation-agent-mobile-parity-3.2.1
          fetch-depth: 0

      - name: Fix migration helper boundary
        shell: python
        run: |
          from pathlib import Path
          p = Path("scripts/migrate-creation-agent-parity.py")
          s = p.read_text(encoding="utf-8")
          old = '''    text = re.sub(
                  r"\\n\\s*private fun interviewHistoryWithAnswer\\([\\s\\S]*?(?=\\n\\s*private fun |\\n\\s*suspend fun |\\n\\s*fun )",
                  "\\n",
                  text,
                  count=1,
              )'''.replace('              ', '    ')
          new = '''    text = remove_between(
                  text,
                  "    private fun interviewHistoryWithAnswer(",
                  "    private suspend fun saveCreationSession(",
                  "interviewHistoryWithAnswer",
              )'''.replace('              ', '    ')
          if old not in s:
              raise RuntimeError("migration helper boundary marker missing")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")

      - name: Apply migration
        run: python scripts/migrate-creation-agent-parity.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt pytest

      - name: Regenerate Android PC contract
        run: python scripts/export-mobile-prompt-contract.py

      - name: Verify backend Creation Agent
        working-directory: backend
        run: |
          python -m pytest tests/test_novel_creation_agent.py tests/test_novel_creation_compact_flow.py -q
          python - <<'PY'
          from app.main import app
          paths = {route.path for route in app.routes}
          assert "/api/v1/novel-creation/agent-turn" in paths
          assert "/api/v1/novel-creation/sessions/{session_id}/interview/next" not in paths
          assert "/api/v1/novel-creation/refresh-question" not in paths
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Verify Android Creation Agent
        working-directory: mobile/android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Guard removed interview flow
        run: |
          if grep -RInE "advanceCreationInterview|answerCreationInterview|MobileCreationInterviewReliability|novelCreationInterview\(" mobile/android/app/src/main mobile/android/app/src/test; then
            echo "Android legacy interview control plane still referenced" >&2; exit 1
          fi
          if grep -RInE "advance_novel_creation_interview|NovelCreationInterviewNextRequest|/interview/next|refresh_question_options|NOVEL_INTERVIEW_" backend/app; then
            echo "Backend legacy interview control plane still referenced" >&2; exit 1
          fi

      - name: Commit verified migration
        run: |
          git config user.name "特昂糖糖糖"
          git config user.email "126449209+teangtang1122@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Align Android with conversational creation agent"
          git push origin HEAD:codex/creation-agent-mobile-parity-3.2.1
