name: Temporary cleanup merged Android feature branches

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'cleanup/merged-android-features-20260819'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Verify and delete merged feature branches
        run: |
          set -euo pipefail
          expected_develop='e01062bde0e6aa8571f6ad64373d18bec7b753f6'
          test "$(git rev-parse HEAD)" = "$expected_develop"

          git fetch origin \
            feature/android-mobile-import-export-ui \
            feature/android-outline-library-parity

          for branch in \
            feature/android-mobile-import-export-ui \
            feature/android-outline-library-parity
          do
            if ! git merge-base --is-ancestor "origin/$branch" HEAD; then
              echo "$branch is not fully merged into develop" >&2
              exit 1
            fi
          done

          git push origin --delete \
            feature/android-mobile-import-export-ui \
            feature/android-outline-library-parity

          git push origin --delete cleanup/merged-android-features-20260819
