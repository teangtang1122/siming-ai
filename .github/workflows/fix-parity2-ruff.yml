name: One-shot parity2 Ruff fix

on:
  push:
    branches:
      - feat/android-pc-contract-parity-2
    paths:
      - .github/workflows/fix-parity2-ruff.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/android-pc-contract-parity-2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'ruff<1,>=0.11'
      - run: |
          cd backend
          python -m ruff check \
            app/modules/continuity/infrastructure/governance.py \
            app/modules/gateway/infrastructure/mutation_service.py \
            --fix
      - run: |
          git rm .github/workflows/fix-parity2-ruff.yml
          git add \
            backend/app/modules/continuity/infrastructure/governance.py \
            backend/app/modules/gateway/infrastructure/mutation_service.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: fix parity2 backend imports"
          git push origin HEAD:feat/android-pc-contract-parity-2
