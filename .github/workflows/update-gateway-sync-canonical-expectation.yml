name: Update gateway sync canonical expectation

on:
  push:
    branches:
      - feat/android-pc-contract-parity-2
    paths:
      - .github/workflows/update-gateway-sync-canonical-expectation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/android-pc-contract-parity-2
      - run: python .github/scripts/update_gateway_sync_canonical_expectation.py
      - run: |
          git rm \
            .github/scripts/update_gateway_sync_canonical_expectation.py \
            .github/workflows/update-gateway-sync-canonical-expectation.yml
          git add backend/tests/test_gateway_sync.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(gateway): expect canonical server conflict snapshots"
          git push origin HEAD:feat/android-pc-contract-parity-2
