name: One-shot mobile canonical contract patch

on:
  push:
    branches:
      - fix/android-canonical-entity-contract
    paths:
      - .github/workflows/mobile-canonical-contract-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-canonical-entity-contract
      - name: Patch Android authoring UI without rewriting the monolithic file manually
        shell: python
        run: |
          from pathlib import Path

          vm_path = Path("mobile/android/app/src/main/java/com/siming/mobile/ui/MainViewModel.kt")
          vm = vm_path.read_text(encoding="utf-8")
          old = "import kotlinx.serialization.json.JsonObject\n"
          new = "import kotlinx.serialization.json.JsonElement\nimport kotlinx.serialization.json.JsonObject\n"
          assert vm.count(old) == 1, "MainViewModel JsonObject import anchor changed"
          vm = vm.replace(old, new, 1)
          old = "        is JsonPrimitive -> put(key, value)\n        else -> put(key, value.toString())"
          new = "        is JsonElement -> put(key, value)\n        else -> put(key, value.toString())"
          assert vm.count(old) == 1, "MainViewModel putAny anchor changed"
          vm = vm.replace(old, new, 1)
          vm_path.write_text(vm, encoding="utf-8")

          app_path = Path("mobile/android/app/src/main/java/com/siming/mobile/ui/SimingApp.kt")
          app = app_path.read_text(encoding="utf-8")

          old = '''    "character" -> listOf(
              FormField("name", "角色名"),
              FormField("role_type", "角色定位", "protagonist / supporting / antagonist"),
              FormField("personality", "性格与口吻", "稳定行为方式、表达习惯与禁区", true),
              FormField("background", "背景", multiline = true),
              FormField("current_goal", "当前目标", multiline = true),
              FormField("active_conflict", "当前冲突", multiline = true),
          )'''
          new = '''    "character" -> listOf(
              FormField("name", "角色名"),
              FormField("aliases", "别名", "一行一个；与 PC 角色别名完全同步", true),
              FormField("role_type", "角色定位", "protagonist / supporting / antagonist / mentor / other"),
              FormField("age", "年龄"),
              FormField("appearance", "外貌", multiline = true),
              FormField("personality", "性格", "稳定行为方式、表达习惯与禁区", true),
              FormField("background", "背景", multiline = true),
              FormField("abilities", "能力", "一行一个；保存为 PC 的 abilities 数组", true),
              FormField("life_status", "生命状态", "active / deceased / unknown"),
              FormField("current_location", "当前位置"),
              FormField("realm_or_level", "境界 / 等级"),
              FormField("physical_state", "身体状态", multiline = true),
              FormField("mental_state", "心理状态", multiline = true),
              FormField("current_goal", "当前目标", multiline = true),
              FormField("active_conflict", "当前冲突", multiline = true),
              FormField("abilities_state", "能力状态", multiline = true),
              FormField("items_or_assets", "持有物 / 资产", multiline = true),
              FormField("is_evolution_tracked", "持续追踪角色变化", "true / false"),
          )'''
          assert app.count(old) == 1, "character field block changed"
          app = app.replace(old, new, 1)

          old = '            fields.forEach { field -> put(field.key, target.record?.text(field.key).orEmpty()) }'
          new = '            fields.forEach { field -> put(field.key, target.record?.formText(field.key).orEmpty()) }'
          assert app.count(old) == 1, "editor value anchor changed"
          app = app.replace(old, new, 1)

          old = '''                "world" -> {
                      putIfAbsent("dimension", "culture")
                      putIfAbsent("sort_order", "0")
                  }
                  "foreshadowing" -> {'''
          new = '''                "world" -> {
                      putIfAbsent("dimension", "culture")
                      putIfAbsent("sort_order", "0")
                  }
                  "character" -> {
                      putIfAbsent("role_type", "supporting")
                      putIfAbsent("life_status", "active")
                      putIfAbsent("is_evolution_tracked", "true")
                  }
                  "foreshadowing" -> {'''
          assert app.count(old) == 1, "character default anchor changed"
          app = app.replace(old, new, 1)

          old = '''                        val mapped = values.mapValues { (key, value) ->
                              if (fields.firstOrNull { it.key == key }?.numeric == true) value.toIntOrNull() ?: 0 else value
                          }.toMutableMap<String, Any?>()'''
          new = '''                        val mapped = if (target.entityType == "character") {
                              canonicalCharacterFormValues(values)
                          } else {
                              values.mapValues { (key, value) ->
                                  if (fields.firstOrNull { it.key == key }?.numeric == true) value.toIntOrNull() ?: 0 else value
                              }.toMutableMap<String, Any?>()
                          }'''
          assert app.count(old) == 1, "mapped form anchor changed"
          app = app.replace(old, new, 1)

          old = '                            "character" -> mapped["is_evolution_tracked"] = true\n'
          assert app.count(old) == 1, "old character forced tracking anchor changed"
          app = app.replace(old, "", 1)

          old = '            val summary = record.text(summaryKey)'
          new = '            val summary = if (entityType == "character") canonicalCharacterSummary(record) else record.text(summaryKey)'
          assert app.count(old) == 1, "character card summary anchor changed"
          app = app.replace(old, new, 1)

          old = '                    "character" -> "角色动机、状态与冲突会随正文一起同步，帮助 AI 减少 OOC。"'
          new = '                    "character" -> "字段直接对应 PC 角色卡：别名、外貌、能力、位置、境界、身心状态、目标与冲突共享同一份数据。"'
          assert app.count(old) == 1, "character description anchor changed"
          app = app.replace(old, new, 1)

          old = '                    "角色目标、冲突、性格与口吻会作为独立资料同步，降低跨章节 OOC。",'
          new = '                    "当前表单直接编辑 PC Character 字段；能力/别名保持数组结构，未展示的稳定写作 profile 会原样保留。",'
          assert app.count(old) == 1, "character banner anchor changed"
          app = app.replace(old, new, 1)

          app_path.write_text(app, encoding="utf-8")
      - name: Commit generated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/android/app/src/main/java/com/siming/mobile/ui/MainViewModel.kt mobile/android/app/src/main/java/com/siming/mobile/ui/SimingApp.kt
          git diff --cached --check
          git commit -m "feat(android): align character editor with PC contract"
          git push origin HEAD:fix/android-canonical-entity-contract
