name: One-shot Android PC parity patch

on:
  push:
    branches:
      - feat/android-pc-contract-parity-2
    paths:
      - .github/workflows/patch-android-pc-parity2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/android-pc-contract-parity-2
      - run: python .github/scripts/patch_android_pc_parity2.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/android/app/src/main/java/com/siming/mobile/data/network/GatewayApi.kt mobile/android/app/src/main/java/com/siming/mobile/data/SimingRepository.kt mobile/android/app/src/main/java/com/siming/mobile/ui/SimingApp.kt
          git diff --cached --check
          git commit -m "feat(android): align core authoring forms and offline writes with PC"
          git push origin HEAD:feat/android-pc-contract-parity-2
