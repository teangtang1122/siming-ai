name: Print migrated Creation Agent lines
on:
  push:
    branches: ["codex/creation-agent-mobile-parity-3.2.1"]
    paths: [".github/workflows/print-creation-agent-lines.yml"]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/creation-agent-mobile-parity-3.2.1
      - name: Patch helper and apply migration
        shell: python
        run: |
          from pathlib import Path
          p = Path("scripts/migrate-creation-agent-parity.py")
          s = p.read_text(encoding="utf-8")
          old = '''    text = re.sub(
                  r"\\n\\s*private fun interviewHistoryWithAnswer\\([\\s\\S]*?(?=\\n\\s*private fun |\\n\\s*suspend fun |\\n\\s*fun )",
                  "\\n",
                  text,
                  count=1,
              )'''.replace('              ', '    ')
          new = '''    text = remove_between(
                  text,
                  "    private fun interviewHistoryWithAnswer(",
                  "    private suspend fun saveCreationSession(",
                  "interviewHistoryWithAnswer",
              )'''.replace('              ', '    ')
          if old not in s: raise RuntimeError("helper marker missing")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          import subprocess
          subprocess.run(["python", "scripts/migrate-creation-agent-parity.py"], check=True)
      - name: Print suspect lines
        run: |
          nl -ba mobile/android/app/src/main/java/com/siming/mobile/data/creation/MobileCreationConversationAgent.kt | sed -n '250,275p;400,415p'
