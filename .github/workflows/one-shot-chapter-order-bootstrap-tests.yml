name: One-shot chapter order bootstrap tests

on:
  push:
    branches:
      - feature/independent-chapter-order
    paths:
      - scripts/one_shot_chapter_order_bootstrap_tests.py
      - .github/workflows/one-shot-chapter-order-bootstrap-tests.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/independent-chapter-order
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Update bootstrap migration tests
        run: python scripts/one_shot_chapter_order_bootstrap_tests.py
      - name: Validate patch
        run: |
          python -m compileall -q backend/tests
          git diff --check
      - name: Commit tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: expect chapter-order schema revision"
          git push origin HEAD:feature/independent-chapter-order
