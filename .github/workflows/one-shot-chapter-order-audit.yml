name: One-shot chapter order audit

on:
  push:
    branches:
      - feature/independent-chapter-order
    paths:
      - .github/workflows/one-shot-chapter-order-audit.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/independent-chapter-order
      - name: Find chapter construction and ordering paths
        run: |
          echo '=== Chapter constructors ==='
          grep -RIn --include='*.py' -E 'Chapter\(' backend/app backend/tests || true
          echo '=== Chapter order_by calls ==='
          grep -RIn --include='*.py' -E 'order_by\([^\n]*Chapter\.|Chapter\.[A-Za-z_]+\.(asc|desc)\(' backend/app backend/tests || true
          echo '=== outline_sort_context consumers ==='
          grep -RIn --include='*.py' 'outline_sort_context' backend/app backend/tests || true
          echo '=== frontend chapter list/reorder references ==='
          grep -RIn --include='*.tsx' --include='*.ts' -E 'chapters/reorder|sort_order|dataSource=\{chapters\}' frontend/src || true
          echo '=== Android sort_order references ==='
          grep -RIn --include='*.kt' 'sort_order' mobile/android/app/src || true
