name: One-shot regenerate OpenAPI types

on:
  push:
    branches:
      - feature/independent-chapter-order
    paths:
      - .github/workflows/one-shot-openapi-generate.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      MOSHU_DISABLE_AUTO_MCP_SETUP: "1"
      SIMING_ENABLE_LOCAL_RUNTIME: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/independent-chapter-order
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Regenerate committed OpenAPI types
        working-directory: frontend
        run: npm run api:generate
      - name: Remove one-shot workflow
        run: rm .github/workflows/one-shot-openapi-generate.yml
      - name: Commit generated contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: regenerate OpenAPI types for chapter ordering"
          git push origin HEAD:feature/independent-chapter-order
