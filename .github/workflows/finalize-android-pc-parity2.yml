name: Finalize Android PC parity branch

on:
  push:
    branches:
      - feat/android-pc-contract-parity-2
    paths:
      - .github/workflows/finalize-android-pc-parity2.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/android-pc-contract-parity-2
      - run: python .github/scripts/finalize_android_pc_parity2.py
      - run: |
          git rm \
            .github/scripts/patch_android_pc_parity2.py \
            .github/scripts/run_patch_android_pc_parity2_v2.py \
            .github/scripts/patch_gateway_pc_parity2.py \
            .github/scripts/patch_gateway_governance_lifecycle.py \
            .github/scripts/finalize_android_pc_parity2.py \
            .github/workflows/patch-android-pc-parity2.yml \
            .github/workflows/patch-android-pc-parity2-v2.yml \
            .github/workflows/patch-gateway-pc-parity2.yml \
            .github/workflows/patch-gateway-governance-lifecycle.yml \
            .github/workflows/finalize-android-pc-parity2.yml
          git add mobile/android/app/src/main/java/com/siming/mobile/ui/SimingApp.kt
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: clean one-shot PC parity tooling"
          git push origin HEAD:feat/android-pc-contract-parity-2
