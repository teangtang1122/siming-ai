name: Diagnose remaining Android Creation Agent compile errors
on:
  push:
    branches: ["codex/creation-agent-mobile-parity-3.2.1"]
    paths: [".github/workflows/diagnose-android-creation-agent-compile-v2.yml"]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/creation-agent-mobile-parity-3.2.1
      - name: Patch source and helper, then migrate
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          p = Path("mobile/android/app/src/main/java/com/siming/mobile/data/creation/MobileCreationConversationAgent.kt")
          s = p.read_text(encoding="utf-8")
          for old, new in {
            'val form = draft.objectValue("form").toMutableMap()': 'val form = (draft["form"] as? JsonObject ?: JsonObject(emptyMap())).toMutableMap()',
            'val stages = draft.objectValue("stages").toMutableMap()': 'val stages = (draft["stages"] as? JsonObject ?: JsonObject(emptyMap())).toMutableMap()',
            'val locks = draft.objectValue("artifact_locks").toMutableMap()': 'val locks = (draft["artifact_locks"] as? JsonObject ?: JsonObject(emptyMap())).toMutableMap()',
          }.items():
            if old not in s: raise RuntimeError(f"source marker missing: {old}")
            s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")
          p = Path("scripts/migrate-creation-agent-parity.py")
          s = p.read_text(encoding="utf-8")
          old = '''    text = re.sub(
                  r"\\n\\s*private fun interviewHistoryWithAnswer\\([\\s\\S]*?(?=\\n\\s*private fun |\\n\\s*suspend fun |\\n\\s*fun )",
                  "\\n",
                  text,
                  count=1,
              )'''.replace('              ', '    ')
          new = '''    text = remove_between(
                  text,
                  "    private fun interviewHistoryWithAnswer(",
                  "    private suspend fun saveCreationSession(",
                  "interviewHistoryWithAnswer",
              )'''.replace('              ', '    ')
          if old not in s: raise RuntimeError("helper marker missing")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          subprocess.run(["python", "scripts/migrate-creation-agent-parity.py"], check=True)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps and regenerate contract
        run: |
          pip install -r backend/requirements.txt >/dev/null
          python scripts/export-mobile-prompt-contract.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - name: Compile with concise diagnostics
        working-directory: mobile/android
        shell: bash
        run: |
          set +e
          ./gradlew compileDebugKotlin testDebugUnitTest --stacktrace --console=plain > /tmp/gradle.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            echo '===== COMPILER / TEST FAILURES ====='
            grep -nE '(^e:|FAILED|FAILURE:|Unresolved reference|Type mismatch|Cannot infer|No value passed|Too many arguments|Compilation error|AssertionError|expected:|but was:)' /tmp/gradle.log | tail -n 220 || true
            echo '===== TAIL ====='
            tail -n 140 /tmp/gradle.log
            exit "$code"
          fi
          echo 'ANDROID COMPILE + UNIT TESTS PASSED'
