name: One-shot auxiliary Gateway contract patch

on:
  push:
    branches:
      - feat/android-pc-parity-3
    paths:
      - .github/workflows/patch-auxiliary-gateway-contracts.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/android-pc-parity-3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python .github/scripts/patch_auxiliary_gateway_contracts.py
      - name: Normalize long validation conditions
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("backend/app/services/gateway_legacy_replication.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '        if not source or not target or source.project_id != project_id or target.project_id != project_id:\n            raise ValidationError("角色关系两端必须属于当前作品")',
              '        if (\n            not source\n            or not target\n            or source.project_id != project_id\n            or target.project_id != project_id\n        ):\n            raise ValidationError("角色关系两端必须属于当前作品")',
          )
          text = text.replace(
              '        if not source or not target or source.project_id != project_id or target.project_id != project_id:\n            raise ValidationError("世界观关系两端必须属于当前作品")',
              '        if (\n            not source\n            or not target\n            or source.project_id != project_id\n            or target.project_id != project_id\n        ):\n            raise ValidationError("世界观关系两端必须属于当前作品")',
          )
          path.write_text(text, encoding="utf-8")
          PY
      - run: |
          python -m pip install 'ruff<1,>=0.11'
          cd backend
          python -m ruff check app/services/gateway_legacy_replication.py tests/test_gateway_auxiliary_authoring_contract.py --fix
      - run: |
          git rm \
            .github/scripts/patch_auxiliary_gateway_contracts.py \
            .github/workflows/patch-auxiliary-gateway-contracts.yml
          git add backend/app/services/gateway_legacy_replication.py backend/tests/test_gateway_auxiliary_authoring_contract.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(gateway): sync auxiliary authoring structures"
          git push origin HEAD:feat/android-pc-parity-3
