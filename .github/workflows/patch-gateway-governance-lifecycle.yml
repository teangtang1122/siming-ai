name: One-shot Gateway governance lifecycle patch

on:
  push:
    branches:
      - feat/android-pc-contract-parity-2
    paths:
      - .github/workflows/patch-gateway-governance-lifecycle.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/android-pc-contract-parity-2
      - run: python .github/scripts/patch_gateway_governance_lifecycle.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/services/gateway_legacy_replication.py
          git diff --cached --check
          git commit -m "fix(gateway): reuse PC governance lifecycle for offline replay"
          git push origin HEAD:feat/android-pc-contract-parity-2
