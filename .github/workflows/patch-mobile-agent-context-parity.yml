name: One-shot mobile Agent context parity patch

on:
  push:
    branches:
      - feat/android-pc-parity-3
    paths:
      - .github/workflows/patch-mobile-agent-context-parity.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/android-pc-parity-3
      - run: python .github/scripts/patch_mobile_agent_context_parity.py
      - run: |
          git rm \
            .github/scripts/patch_mobile_agent_context_parity.py \
            .github/workflows/patch-mobile-agent-context-parity.yml
          git add \
            mobile/android/app/src/main/java/com/siming/mobile/data/agent/MobileWorkspaceAgent.kt \
            mobile/android/app/src/main/java/com/siming/mobile/data/agent/MobileContextParity.kt \
            mobile/android/app/src/test/java/com/siming/mobile/data/agent/MobileContextParityTest.kt
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(android): feed PC relationship and governance context to Agent"
          git push origin HEAD:feat/android-pc-parity-3
