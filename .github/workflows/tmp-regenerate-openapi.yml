name: Temporary regenerate OpenAPI types

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-regenerate-openapi.yml
      - backend/**
      - frontend/**

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    env:
      MOSHU_DISABLE_AUTO_MCP_SETUP: "1"
      SIMING_ENABLE_LOCAL_RUNTIME: "0"
      OPENAI_API_KEY: test-placeholder
      ANTHROPIC_API_KEY: test-placeholder
      ARK_API_KEY: test-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Regenerate OpenAPI types
        working-directory: frontend
        run: npm run api:generate
      - name: Commit generated contract
        shell: bash
        run: |
          if git diff --quiet -- frontend/src/api/generated/schema.d.ts; then
            echo "Generated contract is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/api/generated/schema.d.ts
          git commit -m "chore: regenerate OpenAPI types"
          git push origin HEAD:develop
