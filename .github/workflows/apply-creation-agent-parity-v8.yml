name: Finalize backend and Android creation agent migration

on:
  push:
    branches: ["codex/creation-agent-mobile-parity-3.2.1"]
    paths:
      - ".github/workflows/apply-creation-agent-parity-v8.yml"

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/creation-agent-mobile-parity-3.2.1
          fetch-depth: 0

      - name: Patch source and migration helper
        shell: python
        run: |
          from pathlib import Path

          p = Path("mobile/android/app/src/main/java/com/siming/mobile/data/creation/MobileCreationConversationAgent.kt")
          s = p.read_text(encoding="utf-8")
          for old, new in {
            'val form = draft.objectValue("form").toMutableMap()': 'val form = (draft["form"] as? JsonObject ?: JsonObject(emptyMap())).toMutableMap()',
            'val stages = draft.objectValue("stages").toMutableMap()': 'val stages = (draft["stages"] as? JsonObject ?: JsonObject(emptyMap())).toMutableMap()',
            'val locks = draft.objectValue("artifact_locks").toMutableMap()': 'val locks = (draft["artifact_locks"] as? JsonObject ?: JsonObject(emptyMap())).toMutableMap()',
          }.items():
            if old not in s:
              raise RuntimeError(f"source marker missing: {old}")
            s = s.replace(old, new, 1)
          ambiguous = '''        ENTITY_FIELDS.forEach { (artifact, mappings) ->
            if (artifactFilter.isNotBlank() && artifact != artifactFilter) return@forEach
            val data = source.stageData(artifact)
            mappings.forEach { (field, type) ->
                if (typeFilter.isNotBlank() && type != typeFilter) return@forEach
'''
          labelled = '''        ENTITY_FIELDS.forEach artifactLoop@ { (artifact, mappings) ->
            if (artifactFilter.isNotBlank() && artifact != artifactFilter) return@artifactLoop
            val data = source.stageData(artifact)
            mappings.forEach mappingLoop@ { (field, type) ->
                if (typeFilter.isNotBlank() && type != typeFilter) return@mappingLoop
'''
          if ambiguous in s:
            s = s.replace(ambiguous, labelled, 1)
          p.write_text(s, encoding="utf-8")

          p = Path("scripts/migrate-creation-agent-parity.py")
          s = p.read_text(encoding="utf-8")
          old = '''    text = re.sub(
                  r"\\n\\s*private fun interviewHistoryWithAnswer\\([\\s\\S]*?(?=\\n\\s*private fun |\\n\\s*suspend fun |\\n\\s*fun )",
                  "\\n",
                  text,
                  count=1,
              )'''.replace('              ', '    ')
          new = '''    text = remove_between(
                  text,
                  "    private fun interviewHistoryWithAnswer(",
                  "    private suspend fun saveCreationSession(",
                  "interviewHistoryWithAnswer",
              )'''.replace('              ', '    ')
          if old not in s:
            raise RuntimeError("migration helper boundary marker missing")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")

      - name: Apply migration
        run: python scripts/migrate-creation-agent-parity.py

      - name: Fix generated PC contract unit test
        shell: python
        run: |
          from pathlib import Path
          p = Path("mobile/android/app/src/test/java/com/siming/mobile/data/creation/PcCreationAgentContractTest.kt")
          s = p.read_text(encoding="utf-8")
          old = '        val raw = javaClass.classLoader!!.getResource("pc_workspace_prompt_contract.json")!!.readText()\n'
          new = '''        val contractFile = listOf(
              java.io.File("app/src/main/assets/pc_workspace_prompt_contract.json"),
              java.io.File("src/main/assets/pc_workspace_prompt_contract.json"),
          ).firstOrNull { it.isFile } ?: error("pc_workspace_prompt_contract.json not found from ${System.getProperty("user.dir")}")
          val raw = contractFile.readText()
'''
          if old not in s:
            raise RuntimeError("generated contract test resource marker missing")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")

      - name: Rewrite canonical Android route test
        shell: python
        run: |
          from pathlib import Path
          Path("mobile/android/app/src/test/java/com/siming/mobile/data/network/PcApiPathsTest.kt").write_text(r'''package com.siming.mobile.data.network

          import kotlin.test.Test
          import kotlin.test.assertEquals
          import kotlin.test.assertFailsWith

          class PcApiPathsTest {
              @Test
              fun `novel creation uses the canonical PC V3 routes`() {
                  assertEquals("/api/v1/novel-creation/start", PcApiPaths.NOVEL_CREATION_START)
                  assertEquals("/api/v1/novel-creation/agent-turn", PcApiPaths.NOVEL_CREATION_AGENT_TURN)
                  assertEquals(
                      "/api/v1/novel-creation/sessions/session-1/runs",
                      PcApiPaths.novelCreationRuns("session-1"),
                  )
                  assertEquals(
                      "/api/v1/novel-creation/runs/run-1",
                      PcApiPaths.novelCreationRun("run-1"),
                  )
                  assertEquals(
                      "/api/v1/novel-creation/sessions/session-1/stages/world_style/confirm",
                      PcApiPaths.novelCreationStageConfirm("session-1", "world_style"),
                  )
                  assertEquals("/api/v1/novel-creation/apply", PcApiPaths.NOVEL_CREATION_APPLY)
              }

              @Test
              fun `creation path parameters reject path injection`() {
                  assertFailsWith<IllegalArgumentException> {
                      PcApiPaths.novelCreationSession("session-1/../../config")
                  }
                  assertFailsWith<IllegalArgumentException> {
                      PcApiPaths.novelCreationStage("session-1", "final_review?debug=true")
                  }
              }
          }
          '''.replace('          ', ''), encoding="utf-8")

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt pytest

      - name: Regenerate Android PC contract
        run: python scripts/export-mobile-prompt-contract.py

      - name: Verify backend Creation Agent
        working-directory: backend
        run: |
          python -m pytest tests/test_novel_creation_agent.py tests/test_novel_creation_compact_flow.py -q
          python - <<'PY'
          from app.main import app
          paths = set(app.openapi().get("paths", {}))
          assert any(path.endswith("/novel-creation/agent-turn") for path in paths)
          assert not any(path.endswith("/interview/next") for path in paths)
          assert not any(path.endswith("/refresh-question") for path in paths)
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Verify Android Creation Agent
        working-directory: mobile/android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Guard removed interview control plane
        run: |
          if grep -RInE "advanceCreationInterview|answerCreationInterview|MobileCreationInterviewReliability|novelCreationInterview\(" mobile/android/app/src/main mobile/android/app/src/test; then
            echo "Android legacy interview control plane still referenced" >&2; exit 1
          fi
          if grep -RInE "advance_novel_creation_interview|NovelCreationInterviewNextRequest|/interview/next|refresh_question_options|NOVEL_INTERVIEW_" backend/app; then
            echo "Backend legacy interview control plane still referenced" >&2; exit 1
          fi

      - name: Commit verified migration
        run: |
          git config user.name "特昂糖糖糖"
          git config user.email "126449209+teangtang1122@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Align Android with conversational creation agent"
          git push origin HEAD:codex/creation-agent-mobile-parity-3.2.1
