name: Windows Installer CI

on:
  pull_request:
    paths:
      - ".github/workflows/windows-installer-ci.yml"
      - "build-toolchain.json"
      - "build-installer.bat"
      - "installer/**"
      - "scripts/build-exe.ps1"
      - "scripts/build-installer.ps1"
      - "scripts/verify-python-build-lock.py"
      - "scripts/verify-windows-installer.ps1"
      - "backend/requirements-windows-build.lock"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "backend/launcher.py"
      - "backend/app/installer_updater.py"
      - "backend/app/updater.py"
      - "backend/app/routers/application_updates.py"
      - "backend/tests/test_installer_updater.py"
      - "backend/tests/test_release_packaging_contract.py"
      - "backend/tests/test_windows_installer_contract.py"
      - "backend/tests/test_windows_installer_runtime.py"
  workflow_dispatch:

jobs:
  build-and-install:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      MOSHU_DISABLE_AUTO_MCP_SETUP: "1"
      SIMING_ENABLE_LOCAL_RUNTIME: "0"
      OPENAI_API_KEY: test-placeholder
      ANTHROPIC_API_KEY: test-placeholder
      ARK_API_KEY: test-placeholder
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Windows toolchain
        id: windows_toolchain
        shell: pwsh
        run: |
          $toolchain = Get-Content build-toolchain.json -Raw | ConvertFrom-Json
          "python=$($toolchain.python)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "pip=$($toolchain.pip)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "node=$($toolchain.node)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "npm=$($toolchain.npm)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "inno_setup=$($toolchain.inno_setup)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.windows_toolchain.outputs.node }}
          architecture: x64
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.windows_toolchain.outputs.python }}
          architecture: x64
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-windows-build.lock
            backend/requirements-dev.txt

      - name: Pin npm
        shell: pwsh
        run: npm install --global "npm@${{ steps.windows_toolchain.outputs.npm }}"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version "${{ steps.windows_toolchain.outputs.inno_setup }}" --yes --no-progress --allow-downgrade

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install backend test dependencies
        working-directory: backend
        run: |
          python -m pip install "pip==${{ steps.windows_toolchain.outputs.pip }}"
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Test installer update contracts
        working-directory: backend
        run: python -m pytest tests/test_updater.py tests/test_installer_updater.py tests/test_packaging_contract.py tests/test_release_packaging_contract.py tests/test_windows_installer_contract.py tests/test_windows_installer_runtime.py

      - name: Build Windows installer
        shell: cmd
        run: build-installer.bat

      - name: Verify unsigned installer artifact
        shell: pwsh
        run: ./scripts/verify-windows-installer.ps1 -ReleaseDir release

      - name: Reject stale legacy release assets
        shell: pwsh
        run: |
          $legacyAssets = @("release\Siming.exe", "release\update.json", "release\sha256.txt")
          $found = @($legacyAssets | Where-Object { Test-Path -LiteralPath $_ })
          if ($found.Count -gt 0) {
            throw "Legacy Windows release assets must not be emitted: $($found -join ', ')"
          }

      - name: Smoke install selectable-path package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installDir = Join-Path $env:RUNNER_TEMP "SimingInstallerSmoke"
          Remove-Item -LiteralPath $installDir -Recurse -Force -ErrorAction SilentlyContinue
          $stalePromptDir = Join-Path $installDir "_internal\prompt_specs\assistant"
          New-Item -ItemType Directory -Force -Path $stalePromptDir | Out-Null
          $stalePromptFiles = @("workspace-fast.md", "chapter-fast.md", "chapter-fast-public.md")
          foreach ($stalePromptFile in $stalePromptFiles) {
            Set-Content -LiteralPath (Join-Path $stalePromptDir $stalePromptFile) -Value "stale"
          }
          $process = Start-Process -FilePath (Resolve-Path "release\Siming-Setup.exe") -ArgumentList @(
            "/SP-",
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/SIMINGNOLAUNCH=1",
            "/MERGETASKS=!desktopicon",
            "/DIR=$installDir"
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer smoke failed with exit code $($process.ExitCode)." }
          if (-not (Test-Path -LiteralPath (Join-Path $installDir "Siming.exe") -PathType Leaf)) {
            throw "Installer smoke did not create Siming.exe."
          }
          if (-not (Test-Path -LiteralPath (Join-Path $installDir ".siming-installed") -PathType Leaf)) {
            throw "Installer smoke did not create the installed-layout marker."
          }
          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) {
            throw "Installer smoke did not create an uninstaller."
          }
          $staleSurvivors = @(
            $stalePromptFiles |
              Where-Object { Test-Path -LiteralPath (Join-Path $stalePromptDir $_) }
          )
          if ($staleSurvivors.Count -gt 0) {
            throw "Installer left removed runtime files behind: $($staleSurvivors -join ', ')"
          }
          $env:SIMING_SMOKE_HOME = Join-Path $env:RUNNER_TEMP "SimingInstalledRuntimeSmoke"
          & ./scripts/smoke-test-release.ps1 -SkipBuild -SimingExePath (Join-Path $installDir "Siming.exe")

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Siming-Windows-Installer
          path: |
            release/Siming-Setup.exe
            release/Siming-Setup.sha256
          if-no-files-found: error
          retention-days: 14
