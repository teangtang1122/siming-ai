name: Temporary PR36 UI heading patch

on:
  push:
    branches:
      - agent/opencode-mcp-onboarding

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/opencode-mcp-onboarding
          fetch-depth: 0
      - name: Patch stale onboarding heading assertion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/e2e/ui-layout-regression.spec.ts')
          text = path.read_text(encoding='utf-8')
          old = "await expect(page.getByRole('heading', { name: '免费写作能力已经准备好' })).toBeVisible()"
          new = "await expect(page.getByRole('heading', { name: 'OpenCode 已可用，再完成一步即可启用完整 Agent' })).toBeVisible()"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one stale heading assertion, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/fix-pr36-ui-layout-heading-temporary.yml
          git diff --check
          git diff -- frontend/e2e/ui-layout-regression.spec.ts
      - name: Commit focused E2E fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/e2e/ui-layout-regression.spec.ts .github/workflows/fix-pr36-ui-layout-heading-temporary.yml
          git commit -m 'test: align onboarding visual assertion with MCP step'
          git push origin HEAD:agent/opencode-mcp-onboarding
